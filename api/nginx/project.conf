limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5r/s;

server {
    listen 80;
    server_name ec2-api.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }

}

# The SECURE Server
server {
    listen 443 ssl;
    server_name ec2-api.duckdns.org;

    # from ./certbot/conf
    ssl_certificate /etc/letsencrypt/live/ec2-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ec2-api.duckdns.org/privkey.pem;

    # SSL Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
	limit_req  zone=mylimit burst=10; # Allow 5 req/sec with a burst of 10
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
