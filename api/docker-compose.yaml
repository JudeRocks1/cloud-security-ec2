services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: telemetrydb
    ports:
      - "5432:5432"

  web:
    build: .
    restart: on-failure
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://admin_user:secure_password_123@db/telemetrydb

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/project.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
