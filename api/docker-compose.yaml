services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: telemetrydb
    ports:
      - "5432:5432"

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://admin_user:secure_password_123@db/telemetrydb